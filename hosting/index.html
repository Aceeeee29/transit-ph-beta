<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TransitPH Quick Routes</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f8ff;
        color: #0f1d35;
        font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      }
      .card {
        width: min(560px, 92vw);
        background: #fff;
        border: 1px solid #d4e4f7;
        border-radius: 16px;
        padding: 24px;
        box-sizing: border-box;
      }
      h1 {
        margin: 0 0 10px;
      }
      p {
        margin: 0;
        color: #6f84a2;
        line-height: 1.5;
      }
      code {
        display: inline-block;
        margin-top: 12px;
        padding: 6px 8px;
        border-radius: 8px;
        background: #eef4ff;
        color: #2e7cf6;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>TransitPH Quick Routes</h1>
      <p>Open a quick route link in this format:</p>
      <code>/q/&lt;token&gt;</code>
    </main>
  </body>
</html>
