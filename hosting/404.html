<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Not Found</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f8ff;
        color: #0f1d35;
        font-family: "Segoe UI", "Helvetica Neue", sans-serif;
      }
      .card {
        width: min(520px, 92vw);
        background: #fff;
        border: 1px solid #d4e4f7;
        border-radius: 16px;
        padding: 22px;
        box-sizing: border-box;
      }
      h1 {
        margin: 0 0 8px;
      }
      p {
        margin: 0;
        color: #6f84a2;
      }
      a {
        color: #2e7cf6;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Page not found</h1>
      <p>The link may be invalid or expired. Return to <a href="/">home</a>.</p>
    </main>
  </body>
</html>
